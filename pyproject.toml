[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repo2video"
version = "0.1.0"
description = "Turn a public GitHub repository URL into a narrated demo video."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests",
    "typer",
    "playwright",
    "pydantic>=2",
    "piper-tts",
    "Pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
repo2video = "repo2video.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["repo2video*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = [
    "browser: marks tests as requiring Playwright Chromium browser",
    "ffmpeg: marks tests as requiring FFmpeg and ffprobe on PATH",
]
